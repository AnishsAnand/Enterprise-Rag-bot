# docker-compose.prod2.yml
# Infrastructure + Backend for KV setup
# All service/container/volume/network names use -kv suffix to avoid
# conflicts with colleague's running containers.
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector
  # ---------------------------------------------------------------------------
  postgres-kv:
    image: pgvector/pgvector:0.7.3-pg16
    container_name: enterprise-rag-postgres-kv
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragbot_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - postgres_data-kv:/var/lib/postgresql/data
    ports:
      - "${PGPORT:-5400}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragbot} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network-kv
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis-kv:
    image: redis:7-alpine
    container_name: enterprise-rag-redis-kv
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data-kv:/data
    ports:
      - "${REDIS_PORT:-6378}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network-kv

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus-kv:
    image: prom/prometheus:v2.47.0
    container_name: enterprise-rag-prometheus-kv
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data-kv:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      rag-network-kv:
        aliases:
          - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana-kv:
    image: grafana/grafana:10.2.0
    container_name: enterprise-rag-grafana-kv
    restart: unless-stopped
    depends_on:
      - prometheus-kv
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data-kv:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3006}:3000"
    networks:
      - rag-network-kv
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Backend API - FastAPI Application (exposed on 8004)
  # ---------------------------------------------------------------------------
  backend-kv:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: enterprise-rag-backend-kv:latest
    container_name: enterprise-rag-backend-kv
    restart: unless-stopped
    depends_on:
      postgres-kv:
        condition: service_healthy
      redis-kv:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-kv
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ragbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragbot_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
      POSTGRES_TABLE: ${POSTGRES_TABLE:-enterprise_rag}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ragbot}:${POSTGRES_PASSWORD:-ragbot_secret_2024}@postgres-kv:5432/${POSTGRES_DB:-enterprise_rag}
      REDIS_URL: redis://redis-kv:6379/0

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://models.cloudservices.tatacommunications.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-meta/Llama-3.1-8B-Instruct}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-4096}

      API_AUTH_EMAIL: ${API_AUTH_EMAIL:-}
      API_AUTH_PASSWORD: ${API_AUTH_PASSWORD:-}
      API_AUTH_URL: ${API_AUTH_URL:-https://ipcloud.tatacommunications.com/portalservice/api/v1/getAuthToken}

      ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      UVICORN_LOG_LEVEL: ${UVICORN_LOG_LEVEL:-info}
      PYTHONPATH: /app

      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:4201,http://localhost:3004,http://localhost:8004}
      ALLOW_ALL_ORIGINS: ${ALLOW_ALL_ORIGINS:-false}

      MIN_RELEVANCE_THRESHOLD: ${MIN_RELEVANCE_THRESHOLD:-0.08}
      MAX_CHUNKS_RETURN: ${MAX_CHUNKS_RETURN:-12}
      ENABLE_QUERY_EXPANSION: ${ENABLE_QUERY_EXPANSION:-true}
      ENABLE_SEMANTIC_RERANK: ${ENABLE_SEMANTIC_RERANK:-true}

      TZ: ${TIMEZONE:-UTC}
    volumes:
      - backend_uploads-kv:/app/uploads
      - backend_logs-kv:/app/logs
      - backend_outputs-kv:/app/outputs
    ports:
      - "8004:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/liveness"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      rag-network-kv:
        aliases:
          - enterprise-rag-backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  rag-network-kv:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes (Docker managed)
# ---------------------------------------------------------------------------
volumes:
  postgres_data-kv:
  redis_data-kv:
  prometheus_data-kv:
  grafana_data-kv:
  backend_uploads-kv:
    name: enterprise-rag-backend-uploads-kv
  backend_logs-kv:
    name: enterprise-rag-backend-logs-kv
  backend_outputs-kv:
    name: enterprise-rag-backend-outputs-kv
